services:
  temporal-postgresql:
    image: postgres:13-alpine
    container_name: temporal-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal}
      POSTGRES_DB: ${TEMPORAL_POSTGRES_DB:-temporal}
    volumes:
      - temporal_postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEMPORAL_POSTGRES_USER:-temporal}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - temporal-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  temporal:
    image: temporalio/auto-setup:${TEMPORAL_VERSION:-1.24.2}
    container_name: temporal
    restart: unless-stopped
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    environment:
      - DB=postgres12
      - DB_PORT=${TEMPORAL_POSTGRES_PORT}
      - POSTGRES_USER=${TEMPORAL_POSTGRES_USER}
      - POSTGRES_PWD=${TEMPORAL_POSTGRES_PASSWORD
      - POSTGRES_SEEDS=${TEMPORAL_POSTGRES_HOST}
      - DYNAMIC_CONFIG_FILE_PATH=${TEMPORAL_DYNAMIC_CONFIG_PATH:-config/dynamicconfig/development-sql.yaml}
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    networks:
      - temporal-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.26.2}
    container_name: temporal-ui
    restart: unless-stopped
    ports:
      - "${TEMPORAL_UI_PORT}:8080"
    environment:
      - TEMPORAL_ADDRESS=${TEMPORAL_HOST:-temporal}:${TEMPORAL_PORT:-7233}
      - TEMPORAL_CORS_ORIGINS=${TEMPORAL_UI_CORS_ORIGINS:-http://localhost:8080}
    depends_on:
      - temporal
    networks:
      - temporal-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

networks:
  temporal-network:
    driver: bridge
    name: temporal-network

volumes:
  temporal_postgresql_data:
    driver: local
