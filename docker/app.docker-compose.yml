# Приложение: один образ, разные команды. Настройки берутся из .env, адреса сервисов — внутри сети Docker.
x-app: &app
  build:
    context: ..
  image: tiu-media-hub:local
  restart: unless-stopped
  env_file: ../.env
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    RABBIT_HOST: rabbitmq
    RABBIT_PORT: "5672"
    QDRANT_URL: http://qdrant:6333
    INFINITY_URL: http://infinity:7997
    S3_ENDPOINT_URL: http://minio:9000
    KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/tiu-media-hub/protocol/openid-connect/certs

x-depends: &depends
  postgres:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy
  qdrant:
    condition: service_healthy
  minio-init:
    condition: service_completed_successfully
  migrate:
    condition: service_completed_successfully

services:
  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      <<: *depends
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # CPU: целостность, метаданные, превью, водяные знаки. Процессы × задачи в каждом
  worker-processing:
    <<: *app
    command:
      - taskiq
      - worker
      - src.worker.processing:broker
      - --workers=${PROCESSING_WORKERS:-2}
      - --max-async-tasks=${PROCESSING_MAX_ASYNC_TASKS:-4}
    depends_on: *depends

  # Сеть: эмбеддинги и индекс поиска. Работает параллельно с обработкой
  worker-indexing:
    <<: *app
    command:
      - taskiq
      - worker
      - src.worker.indexing:broker
      - --workers=${INDEXING_WORKERS:-1}
      - --max-async-tasks=${INDEXING_MAX_ASYNC_TASKS:-16}
    depends_on:
      <<: *depends
      infinity:
        condition: service_healthy

  # Периодические задачи: строго один экземпляр
  scheduler:
    <<: *app
    command: ["taskiq", "scheduler", "src.worker.scheduler:scheduler"]
    depends_on:
      rabbitmq:
        condition: service_healthy
