services:
  keycloak-db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Realm tiu-media-hub импортируется при первом старте (существующий realm импорт пропускает)
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    restart: unless-stopped
    command:
      - start-dev
      - --http-port=8080
      - --http-management-port=9000
      # Публичный адрес: issuer токенов одинаков для браузера и бэкенда в Docker
      - --hostname=${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
      - --hostname-backchannel-dynamic=true
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HEALTH_ENABLED: "true"
    depends_on:
      keycloak-db:
        condition: service_healthy
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ../keycloak/realm:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

volumes:
  keycloak_postgres_data:
