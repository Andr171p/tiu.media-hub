services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-dam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dam}
      POSTGRES_DB: ${POSTGRES_DB:-dam}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Начиная с PostgreSQL 18 образ хранит PGDATA в /var/lib/postgresql/<major>/docker
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
