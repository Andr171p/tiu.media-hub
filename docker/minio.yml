services:
  minio:
    image: minio/minio:latest
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # MinIO console
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ALIAS_USER: ${S3_ACCESS_KEY}
      MINIO_ALIAS_PASSWORD: ${S3_SECRET_KEY}
      BUCKET_NAME: ${S3_BUCKET_NAME}
    entrypoint: >
      /bin/sh -c '
      mc alias set local http://minio:9000 "$$MINIO_ALIAS_USER" "$$MINIO_ALIAS_PASSWORD" &&
      mc mb --ignore-existing "local/$$BUCKET_NAME" &&
      mc anonymous set download "local/$$BUCKET_NAME" &&
      echo "MinIO initialized";
      '
    restart: "no"

  cdn:
    image: nginx:alpine
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8080:80"
    environment:
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - cdn_cache:/var/cache/nginx
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://127.0.0.1/healthz"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  minio_data:
  cdn_cache:
