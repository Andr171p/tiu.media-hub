services:
  minio:
    # Официальные образы MinIO больше не публикуются: используется сборка проекта Pigsty
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-dam}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-dam-dev-secret}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOW_ORIGIN:-http://localhost:5173}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"      # S3 API: presigned-загрузка из браузера
      - "${MINIO_CONSOLE_PORT:-9001}:9001"  # консоль администратора
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: ${MINIO_MC_IMAGE:-pgsty/mc:RELEASE.2026-09-16T00-00-00Z}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-dam}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-dam-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-dam}
      CDN_SECRET: ${CDN_SECRET:?CDN_SECRET is required}
    volumes:
      - ./minio/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]
    restart: "no"

  cdn:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      MINIO_HOST: minio:9000
      S3_BUCKET: ${S3_BUCKET:-dam}
      CDN_SECRET: ${CDN_SECRET:?CDN_SECRET is required}
    ports:
      - "${CDN_PORT:-8090}:80"
    volumes:
      - ../nginx/templates:/etc/nginx/templates:ro
      - cdn_cache:/var/cache/nginx
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  minio_data:
  cdn_cache:
