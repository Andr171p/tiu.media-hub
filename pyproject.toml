[project]
name = "tiu-media-hub"
version = "0.1.0"
description = "TIU Media Hub — DAM: коллекции, версии, метаданные, лицензии, водяные знаки, поиск text-to-image"
requires-python = ">=3.14"
dependencies = [
    "aiobotocore>=3.9.0",
    "aiohttp>=3.13.0",
    "alembic>=1.16",
    "asyncpg>=0.31.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.141.1",
    "pillow>=12.0",
    "pydantic[email]>=2.12",
    "pydantic-settings>=2.15",
    "pyjwt[crypto]>=2.13.0",
    "pypdfium2>=5.0",
    "python-dotenv>=1.2",
    "python-magic>=0.4.27",
    "qdrant-client>=1.15",
    "sqlalchemy[asyncio]>=2.0.52",
    "taskiq>=0.11",
    "taskiq-aio-pika>=0.4",
    "uvicorn[standard]>=0.35",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py314"
line-length = 110

extend-exclude = [
    "cli",
    "migrations",
    "migration",
    "src/migrations",
    "alembic.ini",
    "**/__pycache__",
    "**/.mypy_cache",
    "**/.ruff_cache",
    "**/.venv",
]

[tool.ruff.lint]
select = [
    "F",      # Pyflakes
    "E",      # pycodestyle
    "W",
    "C90",    # mccabe
    "I",      # isort
    "N",      # naming
    "UP",     # pyupgrade
    "ASYNC",  # async correctness
    "FAST",   # FastAPI
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "PIE",    # flake8-pie
    "RET",    # return statements
    "SIM",    # simplification
    "ARG",    # unused arguments
    "PL",     # pylint
    "PERF",   # performance
    "RUF",    # Ruff
    "LOG",    # logging
]

ignore = [
    # pytest / testing
    "S101",

    # Sometimes useful in framework/application code
    "ARG001",

    # Python allows this and it is often useful in adapters
    "PLC0415",

    # Relative imports are sometimes useful inside modules
    "TID252",

    # Unicode is valid and common in Russian comments/docstrings
    "RUF001",
    "RUF002",
    "RUF003",

    # Async functions without timeout are sometimes legitimate
    "ASYNC109",

    # Existing project conventions
    "N805",
    "PLW3201",
    "PLW1641",

    # Too opinionated for this codebase
    "TRY003",

    # Игнорировать проверку параметров пути, спрятанных в Depends
    "FAST003",
]


[tool.ruff.lint.isort]
section-order = [
    "future",
    "typing",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"typing" = ["typing"]


[tool.ruff.lint.pylint]
max-args = 15
max-returns = 10
max-branches = 30


[tool.ruff.lint.per-file-ignores]
"tests/**/*" = [
    "PLR2004",
    "E501",
    "PLR0915",
    "S101",
    "ARG001",
    "F401",
    "PLR6301",
]

"migrations/**/*" = [
    "S101",
    "ARG001",
    "F401",
    "PLR6301",
    "I001",
    "ERA001",
]

"**/*crud.py" = [
    "RUF029",
    "ARG001",
]

"**/crud/**/*.py" = [
    "RUF029",
    "ARG001",
]


# ---------------------------------------------------------------------------
# Ruff formatter
# ---------------------------------------------------------------------------

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true


# ---------------------------------------------------------------------------
# MyPy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true

exclude = [
    "src/migration",
    "src/migrations",
    "__samples__",
    ".venv",
]


# ---------------------------------------------------------------------------
# Vulture
# ---------------------------------------------------------------------------

[tool.vulture]
exclude = [
    ".vscode/",
    "__samples__/",
    "tests/",
    ".venv/",
]

ignore_names = [
    "post",
    "put",
    "delete",
    "head",
]

# --- Pytest ---
[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "unit: быстрые unit-тесты для доменной логики",
    "integration: тесты с использованием инфраструктуры",
    "e2e: end-to-end сценарии"
]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.16.2",
]
