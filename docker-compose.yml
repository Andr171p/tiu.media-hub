name: tiu-media-hub

# Весь стек одной командой: docker compose up -d --build
# Режим моделей задаёт COMPOSE_PROFILES в .env: cpu — разработка, gpu — сервер (CUDA + Ollama).
include:
  - docker/postgres.yml
  - docker/rabbitmq.yml
  - docker/storage.yml
  - docker/keycloak.yml
  - docker/qdrant.yml
  - docker/ai.yml
  - docker/app.yml

networks:
  default:
    name: tiu-media-hub
