user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Настройка зоны кэширования
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=cdn_cache:10m max_size=10g inactive=7d use_temp_path=off;

    server {
        listen 80;
        server_name localhost;

        # Добавляем заголовок для проверки кэша (HIT/MISS)
        add_header X-Cache-Status $upstream_cache_status;

        location / {
            # Важно: DNS-сервер Google, чтобы Docker мог разрешать имена сайтов в интернете
            resolver 8.8.8.8 valid=30s;

            # Тестовый сайт-источник (замените example.com на ваш реальный домен, если нужно)
            proxy_pass http://example.com;

            # Для локального теста подменяем Host на домен источника,
            # иначе example.com отклонит запрос от localhost
            proxy_set_header Host example.com;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Включение кэширования
            proxy_cache cdn_cache;
            proxy_cache_valid 200 302 24h;
            proxy_cache_valid 404 1m;

            # Игнорируем заголовки управления кэшем источника, чтобы принудительно кэшировать всё
            proxy_ignore_headers Cache-Control Expires Set-Cookie;

            # Защита от одновременных запросов одного файла
            proxy_cache_lock on;
        }
    }
}
