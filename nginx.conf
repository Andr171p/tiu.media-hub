user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # CDN cache
    proxy_cache_path
        /var/cache/nginx
        levels=1:2
        keys_zone=cdn_cache:50m
        max_size=10g
        inactive=7d
        use_temp_path=off;

    upstream minio {
        server minio:9000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ------------------------------------------------------------
        # Healthcheck
        # ------------------------------------------------------------

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # ------------------------------------------------------------
        # CDN
        #
        # /assets/foo/bar.jpg
        #
        # becomes:
        #
        # http://minio:9000/dam/assets/foo/bar.jpg
        # ------------------------------------------------------------

        location /assets/ {
            proxy_pass http://minio/dam-dev/assets/;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # --------------------------------------------------------
            # Cache
            # --------------------------------------------------------

            proxy_cache cdn_cache;

            proxy_cache_methods GET HEAD;

            proxy_cache_key "$scheme://$host$request_uri";

            proxy_cache_lock on;

            proxy_cache_valid 200 206 24h;
            proxy_cache_valid 301 302 1h;
            proxy_cache_valid 404 1m;

            # Для versioned immutable media.
            proxy_ignore_headers Cache-Control Expires Set-Cookie;

            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;

            add_header Cache-Control
                "public, max-age=31536000, immutable"
                always;

            add_header X-Cache-Status
                $upstream_cache_status
                always;

            # Не кэшируем ошибки 5xx.
            proxy_cache_valid 500 502 503 504 0;
        }
        # ------------------------------------------------------------
        # Everything else
        # ------------------------------------------------------------
        location / {
            return 404;
        }
    }
}
